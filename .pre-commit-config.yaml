exclude: ^docs/references/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: typecheck
        name: mypy
        entry: mypy src/
        language: system
        pass_filenames: false
        types: [python]
