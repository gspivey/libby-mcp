[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libby-mcp"
version = "1.0.0"
description = "MCP server exposing OverDrive/Libby library catalog search to Claude/Kiro"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.28.1,<0.29",
    "fastmcp>=2.10,<3",
    "mangum>=0.19.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-asyncio>=0.23.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.5.0,<1.0",
    "mypy>=1.10.0,<2.0",
    "pre-commit>=3.7.0,<4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["fallback_slugs.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "ANN201", # require return type annotations on public functions
]
ignore = [
    "E501",   # line length handled by formatter
    "ANN201", # temporarily relaxed until implementation phase
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that call real Thunder API (deselect with '-m not integration')",
    "local_integration: MCP protocol tests against a running container (gated by RUN_LOCAL_INTEGRATION=1)",
]
