name: CI

on:
  push:
    branches: [main, development, 'agent/**']
  pull_request:
    branches: [development]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: mypy src/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: pytest tests/ --ignore=tests/integration -v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=80

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: pytest tests/integration/ -v -m integration
        env:
          RUN_INTEGRATION: "1"

  local-integration:
    name: Local Integration Tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build integration image
        run: docker compose -f docker-compose.integration.yml build

      - name: Start server
        run: docker compose -f docker-compose.integration.yml up -d

      - name: Wait for readiness (GET /mcp -> 405)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/mcp || true)
            if [ "$code" = "405" ]; then echo "server up"; exit 0; fi
            sleep 2
          done
          echo "server did not become ready"; exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test deps
        run: pip install -r requirements-dev.txt

      - name: Run MCP protocol tests
        env:
          RUN_LOCAL_INTEGRATION: "1"
          MCP_ENDPOINT: http://localhost:8000/mcp
          MCP_API_KEY: ci-test-key
        run: pytest tests/integration/test_mcp_protocol.py -v -m local_integration

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  comment:
    name: PR Comment
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: [lint, typecheck, test, local-integration]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const results = {
              lint: '${{ needs.lint.result }}',
              typecheck: '${{ needs.typecheck.result }}',
              test: '${{ needs.test.result }}',
              localIntegration: '${{ needs.local-integration.result }}'
            };

            const statusIcon = (s) => s === 'success' ? 'pass' : s === 'failure' ? 'FAIL' : s;
            const overall = Object.values(results).some(r => r === 'failure') ? 'failed' : 'passed';

            const body = [
              '## CI Report',
              '',
              `Result: **${overall}**`,
              '',
              `Commit: \`${context.sha.slice(0, 8)}\``,
              '',
              '| Check | Status |',
              '| --- | --- |',
              `| Lint (ruff) | ${statusIcon(results.lint)} |`,
              `| Type Check (mypy) | ${statusIcon(results.typecheck)} |`,
              `| Test (pytest) | ${statusIcon(results.test)} |`,
              `| Local Integration Tests | ${statusIcon(results.localIntegration)} |`,
              '',
              `[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
