# Local integration test service: builds Dockerfile.integration and serves the
# MCP endpoint on http://localhost:8000/mcp. Started by `make integration-test`
# and the `local-integration` CI job. No secrets; the test token is non-secret.
services:
  libby-mcp:
    build:
      context: .
      dockerfile: Dockerfile.integration
    image: libby-mcp-integration:local
    ports:
      - "8000:8000"
    environment:
      # Must match the image default (Dockerfile.integration ENV).
      LIBBY_MCP_API_KEY: ci-test-key
    healthcheck:
      # The endpoint is POST-only and auth-gated, so the only unauthenticated,
      # side-effect-free liveness probe is GET /mcp, which AuthMiddleware answers
      # with HTTP 405. 405 therefore means "the ASGI app is up and routing".
      # python:3.12-slim ships no curl/wget, so probe with stdlib urllib.
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import sys, urllib.request as u, urllib.error as e
          try:
              u.urlopen(u.Request("http://localhost:8000/mcp"), timeout=3)
          except e.HTTPError as ex:
              sys.exit(0 if ex.code == 405 else 1)
          except Exception:
              sys.exit(1)
          sys.exit(1)
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
